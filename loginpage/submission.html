<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียนผลงาน - Youth Camp</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,800" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* 2. Reset & Global Styles ตามหน้า Login */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', 'Kanit', sans-serif;
        }

        body {
            background: #f6f5f7; /* สีพื้นหลังเดียวกับหน้า Login */
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            padding-bottom: 50px;
        }

        /* Container หลัก */
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        /* Page Header */
        .page-header {
            text-align: center;
            margin-bottom: 3rem;
            margin-top: 2rem;
        }

        .page-header h1 {
            font-weight: bold;
            font-size: 2.5rem;
            color: #333;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .page-header p {
            font-size: 1rem;
            font-weight: 100; /* ตามสไตล์ <p> ในหน้า Login */
            letter-spacing: 0.5px;
            color: #666;
        }

        /* Grid Layout */
        .content-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media (min-width: 1024px) {
            .content-grid {
                grid-template-columns: 1.5fr 1fr; /* แบ่งซ้ายขวา */
            }
        }

        /* Card Style (เลียนแบบ .container สีขาวในหน้า Login) */
        .card {
            background: #FFFFFF;
            border-radius: 20px; /* ความโค้ง */
            padding: 40px; /* Padding ภายใน */
            box-shadow: 0 14px 28px rgba(0,0,0,0.25), 
                        0 10px 10px rgba(0,0,0,0.22); /* เงาเดียวกับหน้า Login */
            position: relative;
            overflow: hidden;
        }

        .card h2 {
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            color: #333;
        }

        /* Form Elements Style (ตามหน้า Login เป๊ะๆ) */
        .form-group {
            margin-bottom: 1.5rem;
            width: 100%;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
            text-align: left; /* จัดชิดซ้ายให้อ่านง่ายสำหรับฟอร์มยาว */
        }

        /* Input & Textarea: พื้นหลังเทา ไม่มีขอบ */
        .form-group input,
        .form-group textarea {
            background-color: #eee;
            border: none;
            padding: 12px 15px;
            margin: 8px 0;
            width: 100%;
            font-size: 14px;
            border-radius: 5px; /* ปรับมนนิดหน่อย */
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            background-color: #e8e8e8;
            /* เพิ่มเส้นใต้สีทองเวลา Focus เพื่อความสวยงาม */
            box-shadow: 0 2px 0 #c49a67; 
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
            font-family: 'Montserrat', 'Kanit', sans-serif;
        }

        /* Layout 2 คอลัมน์ในฟอร์ม */
        .form-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        @media (min-width: 640px) {
            .form-row {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* Word Count */
        .word-count {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .word-count span {
            font-size: 12px;
            color: #888;
        }

        /* Upload Area */
        .upload-area {
            background-color: #eee; /* พื้นหลังเทา */
            border: 2px dashed #ccc;
            border-radius: 10px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-area:hover {
            border-color: #c49a67; /* สีทองตอน Hover */
            background-color: #e9e4dc; /* สีทองจางๆ */
        }

        .upload-icon {
            width: 40px;
            height: 40px;
            margin-bottom: 10px;
            color: #c49a67; /* ไอคอนสีทอง */
        }

        .upload-text {
            font-weight: bold;
            color: #555;
            font-size: 14px;
        }

        .upload-hint {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }

        /* Submit Button (สีทองเหมือนหน้า Login) */
        .submit-btn {
            border-radius: 20px;
            border: 1px solid #c49a67;
            background-color: #c49a67;
            color: #FFFFFF;
            font-size: 14px;
            font-weight: bold;
            padding: 15px 45px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: transform 80ms ease-in;
            width: 100%;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(196, 154, 103, 0.4);
        }

        .submit-btn:active {
            transform: scale(0.95);
        }
        
        .submit-btn:hover {
            background-color: #b38b5a; /* เข้มขึ้นนิดนึง */
        }

        /* Preview Card */
        .preview-card {
            position: sticky;
            top: 2rem;
            text-align: center;
        }

        .preview-container {
            width: 100%;
            max-width: 300px;
            aspect-ratio: 9/16;
            border-radius: 10px;
            overflow: hidden;
            margin: 0 auto;
            background-color: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 5px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .preview-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Toast Style (ปรับสีให้เข้า theme) */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: white;
            padding: 1.5rem 2rem;
            border-radius: 12px;
            box-shadow: 0 14px 28px rgba(0,0,0,0.25);
            display: none;
            z-index: 10000;
            min-width: 300px;
            text-align: center;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .toast.show {
            display: block;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .toast.success { border-top: 10px solid #4caf50; }
        .toast.error { border-top: 10px solid #dc3545; }
        .toast-title { font-weight: bold; font-size: 1.5rem; margin-bottom: 0.5rem; color: #333; }
        .toast-description { font-size: 0.9rem; color: #666; }

    </style>
</head>

<body>

    <div class="main-container">
        <div class="page-header">
            <h1>ลงทะเบียนผลงาน</h1>
            <p>กรอกรายละเอียดเพื่อส่งผลงานเข้าร่วม Project Youth Camp</p>
        </div>

        <div class="content-grid">
            <div class="card">
                <h2>รายละเอียดการส่ง</h2>
                <form id="registerForm">
                    <div class="form-group">
                        <label for="videoTitle">ชื่อวิดีโอ</label>
                        <input type="text" id="videoTitle" name="videoTitle" placeholder="เช่น ป่าไม้ที่หายไป" required>
                    </div>

                    <div class="form-group">
                        <label for="theme">ธีมหัวข้อ</label>
                        <input type="text" id="theme" name="theme" placeholder="เช่น สิ่งแวดล้อม (Planet)" required>
                    </div>

                    <div class="form-group">
                        <div class="word-count">
                            <label for="description">รายละเอียด (Synopsis)</label>
                            <span id="wordCount">0/100 คำ</span>
                        </div>
                        <textarea id="description" name="description"
                            placeholder="อธิบายเกี่ยวกับวิดีโอของคุณสั้นๆ ไม่เกิน 100 คำ..."
                            required></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="teamName">ชื่อทีมผู้จัดทำ</label>
                            <input type="text" id="teamName" name="teamName" placeholder="ชื่อทีมของคุณ" required>
                        </div>
                        <div class="form-group">
                            <label for="tiktokLink">ลิงก์ TikTok</label>
                            <input type="url" id="tiktokLink" name="tiktokLink"
                                placeholder="https://www.tiktok.com/@username..." required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>ภาพปกผลงาน (Cover)</label>
                        <div class="upload-area" id="uploadArea">
                            <input type="file" id="coverImage" name="coverImage" accept="image/*" style="display: none;">
                            <svg class="upload-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                            </svg>
                            <p class="upload-text">คลิกเพื่ออัปโหลด หรือลากไฟล์มาวางที่นี่</p>
                            <p class="upload-hint">ขนาดแนะนำ 1080x1920 px (JPG/PNG) ไม่เกิน 10MB</p>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn">ยืนยันการลงทะเบียน</button>
                </form>
            </div>

            <div class="card preview-card">
                <h2>ตัวอย่างรูปปก</h2>
                <div class="preview-container">
                    <img id="previewImage"
                        src="https://via.placeholder.com/300x533/eee/c49a67?text=Cover+Preview"
                        alt="Preview">
                </div>
                <p style="margin-top: 20px; font-size: 12px; color: #888;">ตัวอย่างการแสดงผลเมื่ออยู่บนแพลตฟอร์ม</p>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">
        <div class="toast-title" id="toastTitle"></div>
        <div class="toast-description" id="toastDescription"></div>
    </div>

    <script>
        // ------------------------------------------
        // Logic เดิม (Word Count, Upload, Toast)
        // ------------------------------------------
        const textarea = document.getElementById("description");
        const wordCountDisplay = document.getElementById("wordCount");
        // ใช้ Intl.Segmenter ถ้า Browser รองรับ (ถ้าไม่รองรับอาจต้องใช้การ split space แทน)
        let segmenter;
        try {
             segmenter = new Intl.Segmenter("th", { granularity: "word" });
        } catch (e) {
            // Fallback แบบง่ายสำหรับ Browser เก่า
            segmenter = null;
        }

        function countThaiWords(text) {
            if (segmenter) {
                const segments = [...segmenter.segment(text)].filter(seg => seg.isWordLike);
                return segments.length;
            } else {
                // Fallback: นับตามช่องว่าง
                return text.trim().split(/\s+/).length;
            }
        }

        textarea.addEventListener("input", () => {
            let text = textarea.value;
            // Logic เดิมของคุณ (ตัดคำถ้าเกิน)
            // เพื่อความง่ายในตัวอย่างนี้ ผมจะแค่โชว์ตัวเลข แต่ไม่ตัด Text ทิ้งแบบ Hard cut เพื่อ UX ที่ดีกว่า
            let words = countThaiWords(text);
            wordCountDisplay.textContent = `${words}/100 คำ`;
            
            if (words > 100) {
                wordCountDisplay.style.color = "red";
            } else {
                wordCountDisplay.style.color = "#888";
            }
        });

        // Image upload logic
        const coverImageInput = document.getElementById('coverImage');
        const uploadArea = document.getElementById('uploadArea');
        const previewImage = document.getElementById('previewImage');

        uploadArea.addEventListener('click', () => coverImageInput.click());

        coverImageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                if (file.size > 10 * 1024 * 1024) {
                    showToast('ไฟล์ใหญ่เกินไป', 'กรุณาเลือกไฟล์ขนาดไม่เกิน 10MB', 'error');
                    return;
                }
                const reader = new FileReader();
                reader.onloadend = () => previewImage.src = reader.result;
                reader.readAsDataURL(file);
            }
        });

        // Drag and Drop Styling update
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#c49a67'; // Gold
            uploadArea.style.backgroundColor = '#e9e4dc';
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.borderColor = '#ccc';
            uploadArea.style.backgroundColor = '#eee';
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#ccc';
            uploadArea.style.backgroundColor = '#eee';
            
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                coverImageInput.files = e.dataTransfer.files;
                const event = new Event('change');
                coverImageInput.dispatchEvent(event);
            }
        });

        // Toast Function
        function showToast(title, description, type = 'success') {
            const toast = document.getElementById('toast');
            const toastTitle = document.getElementById('toastTitle');
            const toastDescription = document.getElementById('toastDescription');

            toastTitle.textContent = title;
            toastDescription.textContent = description;
            
            // Reset classes
            toast.className = 'toast show';
            toast.classList.add(type);

            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Submit Form
        const registerForm = document.getElementById('registerForm');
        registerForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (!coverImageInput.files[0]) {
                showToast('แจ้งเตือน', 'กรุณาอัปโหลดภาพปกก่อน', 'error');
                return;
            }
            // Simulate Success
            showToast('ลงทะเบียนสำเร็จ!', 'ระบบได้รับข้อมูลเรียบร้อยแล้ว', 'success');
            // window.location.href = 'success.html'; // ในอนาคต
        });
    </script>
</body>
</html>
