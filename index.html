<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youth Content Gallery - แพลตฟอร์มแสดงผลงานวิดีโอเพื่อสังคม</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #ffffff;
            color: #1a1a1a;
            line-height: 1.6;
        }

        .container { max-width: 1400px; margin: 0 auto; padding: 0 1rem; }

        header {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #e5e7eb;
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1.5rem 0;
        }

        h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #ef4444, #737373);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Search */
        .search-wrapper { max-width: 500px; margin: 2rem auto; }

        .search-box { position: relative; }
        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            border: 1px solid #e5e7eb;
            border-radius: 0.75rem;
            font-size: 1rem;
        }
        .search-box input:focus {
            border-color: #ef4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }
        .search-icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
        }

        /* Grid */
        .projects-count { text-align: center; margin: 2rem 0; font-size: 1.25rem; font-weight: 600; }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }

        .project-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 0.75rem;
            overflow: hidden;
            transition: all 0.3s;
            box-shadow: 0 4px 20px -2px rgba(239, 68, 68, 0.1);
        }

        .project-cover { position: relative; aspect-ratio: 9/16; overflow: hidden; background: #f3f4f6; }

        .project-cover img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.3s;
        }

        .project-card:hover .project-cover img { transform: scale(1.05); }

        .project-content { padding: 1rem; }

        .project-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.5rem; }

        .project-badge {
            display: inline-block; padding: 0.25rem 0.75rem;
            background: #fee2e2; color: #dc2626; border-radius: 9999px;
            font-size: 0.75rem; margin-bottom: 0.75rem;
        }

        .project-description { color: #6b7280; font-size: 0.9rem; margin-bottom: 0.75rem; }

        .project-team { font-size: 0.9rem; color: #374151; margin-bottom: 0.75rem; }

        .project-stats { display: flex; gap: 1rem; padding-top: 0.75rem;
            font-size: 0.85rem; color: #6b7280; border-top: 1px solid #f3f4f6; }

        .btn-group { display: flex; gap: 0.5rem; margin-top: 1rem; }

        .btn {
            flex: 1;
            padding: 0.5rem;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .btn-watch { background: #3b82f6; color: white; }
        .btn-watch:hover { background: #2563eb; }

        .btn-vote { background: #ef4444; color: white; }
        .btn-vote:hover { background: #dc2626; }

        .empty-state { text-align: center; margin-top: 3rem; color: #6b7280; font-size: 1.25rem; }

    </style>
</head>
<body>
<header>
    <div class="container">
        <h1>Youth Content Gallery</h1>
        <p class="subtitle">แพลตฟอร์มแสดงผลงานวิดีโอเพื่อสังคม</p>
    </div>
</header>

<div class="container">

    <!-- Search -->
    <div class="search-wrapper">
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="ค้นหาผลงาน..." oninput="filterProjects()">
        </div>
    </div>

    <div class="projects-count">
        ผลงานทั้งหมด (<span id="projectCount">0</span>)
    </div>

    <div id="projectsGrid" class="projects-grid"></div>

    <div id="emptyState" class="empty-state" style="display:none;">
        ❌ ไม่มีผลงาน
    </div>

</div>

<script>
/* -----------------------
   🎬 DATA (ตัวอย่าง)
-------------------------*/
let projects = [
    {
        id: 1,
        title: "ป่าไม้ที่หายไป",
        theme: "สิ่งแวดล้อม (Planet)",
        description: "ป่าไม้เป็นสิ่งที่อยู่คู่กับสังคมไทย...",
        teamName: "ทีมป่าไม้ของฉัน",
        tiktokLink: "https://www.tiktok.com/@example/video/123",
        coverImage: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=400",
        views: 1250,
        likes: 180
    }
];

/* -----------------------
   🎬 RENDER PROJECTS
-------------------------*/
function renderProjects(list = projects) {
    const grid = document.getElementById("projectsGrid");
    const count = document.getElementById("projectCount");
    const emptyState = document.getElementById("emptyState");

    count.textContent = list.length;

    if (list.length === 0) {
        grid.innerHTML = "";
        emptyState.style.display = "block";
        return;
    }

    emptyState.style.display = "none";

    grid.innerHTML = list
        .map(p => `
        <div class="project-card">
            <div class="project-cover">
                <img src="${p.coverImage}" alt="${p.title}">
            </div>
            <div class="project-content">
                <h3 class="project-title">${p.title}</h3>
                <span class="project-badge">${p.theme}</span>

                <p class="project-description">${p.description}</p>
                <p class="project-team">โดย ${p.teamName}</p>

                <div class="project-stats">
                    <div>👁️ ${p.views}</div>
                    <div>❤️ ${p.likes}</div>
                </div>

                <div class="btn-group">
                    <button class="btn btn-watch" onclick="watchVideo('${p.tiktokLink}')">▶ ดูวิดีโอ</button>
                    <button class="btn btn-vote" onclick="voteProject(${p.id})">❤️ โหวต</button>
                </div>
            </div>
        </div>
    `).join("");
}

/* -----------------------
   🔍 FILTER
-------------------------*/
function filterProjects() {
    const q = document.getElementById("searchInput").value.toLowerCase();

    const result = projects.filter(p =>
        p.title.toLowerCase().includes(q) ||
        p.theme.toLowerCase().includes(q) ||
        p.teamName.toLowerCase().includes(q)
    );

    renderProjects(result);
}

/* -----------------------
   ▶ WATCH VIDEO
-------------------------*/
function watchVideo(url) {
    window.open(url, "_blank");
}

/* -----------------------
   ❤️ VOTE (1 คนโหวตได้ 1 คลิป)
-------------------------*/
function voteProject(id) {

    // ถ้าผู้ใช้เคยโหวตแล้ว ไม่ให้โหวตอีก
    if (localStorage.getItem("voted_once")) {
        alert("คุณใช้สิทธิ์โหวตไปแล้ว ไม่สามารถโหวตคลิปอื่นได้อีก");
        return;
    }

    // หา project ที่ถูกโหวต
    const p = projects.find(x => x.id === id);
    if (!p) return;

    // เพิ่มจำนวนโหวต
    p.likes++;

    // บันทึกว่าโหวตแล้ว
    localStorage.setItem("voted_once", "true");

    alert("ขอบคุณสำหรับการโหวต!");

    // อัปเดตหน้าเว็บ
    renderProjects(projects);
}


</script>
</body>
</html>
