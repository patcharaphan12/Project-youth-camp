<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youth Content Gallery - แพลตฟอร์มแสดงผลงานวิดีโอเพื่อสังคม</title>

    <style>
        /* (CSS ส่วนที่เหลือเหมือนเดิม) */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #ffffff;
            color: #1a1a1a;
            line-height: 1.6;
        }

        .container { max-width: 1400px; margin: 0 auto; padding: 0 1rem; }

        header {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #e5e7eb;
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1.5rem 0;
        }

        h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #ef4444, #737373);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        /* Search */
        .search-wrapper { max-width: 500px; margin: 2rem auto; }

        .search-box { position: relative; }
        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            border: 1px solid #e5e7eb;
            border-radius: 0.75rem;
            font-size: 1rem;
        }
        .search-box input:focus {
            border-color: #ef4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }
        .search-icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
        }

        /* Grid */
        .projects-count { text-align: center; margin: 2rem 0; font-size: 1.25rem; font-weight: 600; }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }

        .project-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 0.75rem;
            overflow: hidden;
            transition: all 0.3s;
            box-shadow: 0 4px 20px -2px rgba(239, 68, 68, 0.1);
        }

        .project-cover { position: relative; aspect-ratio: 9/16; overflow: hidden; background: #f3f4f6; }

        .project-cover img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.3s;
        }

        .project-card:hover .project-cover img { transform: scale(1.05); }

        .project-content { padding: 1rem; }

        .project-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.5rem; }

        .project-badge {
            display: inline-block; padding: 0.25rem 0.75rem;
            background: #fee2e2; color: #dc2626; border-radius: 9999px;
            font-size: 0.75rem; margin-bottom: 0.75rem;
        }

        .project-description { color: #6b7280; font-size: 0.9rem; margin-bottom: 0.75rem; }

        .project-team { font-size: 0.9rem; color: #374151; margin-bottom: 0.75rem; }

        .project-stats { display: flex; gap: 1rem; padding-top: 0.75rem;
            font-size: 0.85rem; color: #6b7280; border-top: 1px solid #f3f4f6; }

        .btn-group { display: flex; gap: 0.5rem; margin-top: 1rem; }

        .btn {
            flex: 1;
            padding: 0.5rem;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .btn-watch { background: #3b82f6; color: white; }
        .btn-watch:hover { background: #2563eb; }

        .btn-vote { background: #ef4444; color: white; }
        .btn-vote:hover { background: #dc2626; }

        .empty-state { 
            text-align: center; 
            margin-top: 3rem; 
            color: #6b7280; 
            font-size: 1.25rem;
            /* 🚩 การแก้ไข: ซ่อนไว้ตั้งแต่แรก และจะแสดงด้วย JS เมื่อไม่มีผลงาน */
            display: none; 
        }

    </style>
</head>
<body>
<header>
    <div class="container">
        <h1>Youth Content Gallery</h1>
        <p class="subtitle">แพลตฟอร์มแสดงผลงานวิดีโอเพื่อสังคม</p>
    </div>
</header>

<div class="container">

    <div class="search-wrapper">
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="ค้นหาผลงาน..." oninput="filterProjects()">
        </div>
    </div>

    <div class="projects-count">
        ผลงานทั้งหมด (<span id="projectCount">0</span>)
    </div>

    <div id="projectsGrid" class="projects-grid"></div>

    <div id="emptyState" class="empty-state">
        ❌ ไม่มีผลงาน
    </div>

</div>
